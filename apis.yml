name: Fable Therapeutics
description: Fable Therapeutics is a biopharmaceutical company developing protein-engineered
  biologics for obesity and metabolic disease. Its lead candidate, FBL-140, is an infrequently
  dosed monoclonal antibody antagonizing the activin receptor type II (ActR2) pathway to
  reduce body weight and fat while preserving lean muscle mass and improving cardiometabolic
  health, with clinical trials expected to begin in early 2027. The company is also advancing
  a combination therapy pairing ActR2 antagonism with an incretin mimetic. Fable Therapeutics
  is a deep-tech portfolio company backed by DCVC. It operates as a traditional drug-development
  company and does not currently publish any public API, developer documentation, or technical
  platform.
